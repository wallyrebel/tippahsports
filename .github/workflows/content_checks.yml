name: RSS content offline checks
on:
  pull_request:
    paths:
      - 'src/rss_to_wp/content_quality.py'
      - 'src/rss_to_wp/feeds/**'
      - 'src/rss_to_wp/rewriter/**'
      - 'src/rss_to_wp/cli.py'
      - 'tests/test_content_quality.py'
      - '.github/workflows/content_checks.yml'
  push:
    branches: [main]
    paths:
      - 'src/rss_to_wp/content_quality.py'
      - 'src/rss_to_wp/feeds/**'
      - 'src/rss_to_wp/rewriter/**'
      - 'src/rss_to_wp/cli.py'
      - 'tests/test_content_quality.py'
      - '.github/workflows/content_checks.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=src python -m pytest -q tests/test_content_quality.py
